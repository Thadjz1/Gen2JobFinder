<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen2JobFinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wordmark">Gen2</div>

  <div class="batch-tracker" id="batchTracker" aria-label="Today's batch progress">
    <!-- 5 cup icons injected by app.js -->
  </div>
</header>

<!-- Subtle decorative monstera plants, purely visual, behind all content -->
<div class="deco-plant deco-plant-bottom-left" aria-hidden="true">
  <svg viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
      <g id="monstera-leaf">
        <path d="M0,-2 Q-2,-70 0,-130" stroke="#5C7355" stroke-width="6" fill="none"/>
        <path fill-rule="evenodd" fill="#4A6B45" d="
          M 0,0
          C -55,-12 -82,-75 -72,-130
          C -88,-175 -65,-225 0,-255
          C 65,-225 88,-175 72,-130
          C 82,-75 55,-12 0,0
          Z
          M -45,-115 A 13,20 -18 1,0 -22,-124 A 13,20 -18 1,0 -45,-115 Z
          M 22,-124 A 13,20 18 1,0 45,-115 A 13,20 18 1,0 22,-124 Z
          M -58,-165 A 10,15 -12 1,0 -40,-171 A 10,15 -12 1,0 -58,-165 Z
          M 40,-171 A 10,15 12 1,0 58,-165 A 10,15 12 1,0 40,-171 Z
          M -32,-65 A 11,17 -10 1,0 -12,-71 A 11,17 -10 1,0 -32,-65 Z
          M 12,-71 A 11,17 10 1,0 32,-65 A 11,17 10 1,0 12,-71 Z
        "/>
        <path d="M0,-10 L0,-252 M0,-110 L-45,-162 M0,-110 L45,-162 M0,-60 L-28,-70 M0,-60 L28,-70 M0,-150 L-62,-125 M0,-150 L62,-125"
              stroke="#3A5236" stroke-width="1.3" fill="none" opacity="0.45"/>
      </g>
    </defs>
    <g transform="translate(70,270) rotate(-38) scale(0.55)"><use xlink:href="#monstera-leaf" fill="#3F5C3B"/></g>
    <g transform="translate(150,275) rotate(28) scale(0.5)"><use xlink:href="#monstera-leaf" fill="#557A50"/></g>
    <g transform="translate(105,280) rotate(-6) scale(0.72)"><use xlink:href="#monstera-leaf"/></g>
  </svg>
</div>
<div class="deco-plant deco-plant-bottom-right" aria-hidden="true">
  <svg viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
      <g id="monstera-leaf-2">
        <path d="M0,-2 Q-2,-70 0,-130" stroke="#5C7355" stroke-width="6" fill="none"/>
        <path fill-rule="evenodd" fill="#4A6B45" d="
          M 0,0
          C -55,-12 -82,-75 -72,-130
          C -88,-175 -65,-225 0,-255
          C 65,-225 88,-175 72,-130
          C 82,-75 55,-12 0,0
          Z
          M -45,-115 A 13,20 -18 1,0 -22,-124 A 13,20 -18 1,0 -45,-115 Z
          M 22,-124 A 13,20 18 1,0 45,-115 A 13,20 18 1,0 22,-124 Z
          M -58,-165 A 10,15 -12 1,0 -40,-171 A 10,15 -12 1,0 -58,-165 Z
          M 40,-171 A 10,15 12 1,0 58,-165 A 10,15 12 1,0 40,-171 Z
          M -32,-65 A 11,17 -10 1,0 -12,-71 A 11,17 -10 1,0 -32,-65 Z
          M 12,-71 A 11,17 10 1,0 32,-65 A 11,17 10 1,0 12,-71 Z
        "/>
        <path d="M0,-10 L0,-252 M0,-110 L-45,-162 M0,-110 L45,-162 M0,-60 L-28,-70 M0,-60 L28,-70 M0,-150 L-62,-125 M0,-150 L62,-125"
              stroke="#3A5236" stroke-width="1.3" fill="none" opacity="0.45"/>
      </g>
    </defs>
    <g transform="translate(190,270) rotate(38) scale(0.55)"><use xlink:href="#monstera-leaf-2" fill="#3F5C3B"/></g>
    <g transform="translate(110,275) rotate(-28) scale(0.5)"><use xlink:href="#monstera-leaf-2" fill="#557A50"/></g>
    <g transform="translate(155,280) rotate(6) scale(0.72)"><use xlink:href="#monstera-leaf-2"/></g>
  </svg>
</div>

<main class="board" id="board">
  <div class="state-message" id="loadingMessage">Brewing today's batch…</div>
</main>

<!-- Skip reason picker, shown as an inline panel over the card that triggered it -->
<div class="reason-overlay" id="reasonOverlay" hidden>
  <div class="reason-panel">
    <p class="reason-title">Why skip this one?</p>
    <div class="reason-chips">
      <button class="chip" data-reason="Wrong industry">Wrong industry</button>
      <button class="chip" data-reason="Too senior/junior">Too senior/junior</button>
      <button class="chip" data-reason="Bad culture fit">Bad culture fit</button>
      <button class="chip" data-reason="Comp/location mismatch">Comp/location mismatch</button>
      <button class="chip" data-reason="Not mission-aligned">Not mission-aligned</button>
      <button class="chip" data-reason="Other">Other</button>
    </div>
    <div class="other-reason-wrap" id="otherReasonWrap" hidden>
      <textarea id="otherReasonText" class="other-reason-input" placeholder="Briefly describe why..."></textarea>
      <button class="btn btn-primary" id="otherReasonSubmit" type="button">Submit</button>
    </div>
    <button class="reason-cancel" id="reasonCancel">Cancel</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
